[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prori"
version = "0.0.1"
description = "Official Python SDK for Prori (prori.ai) — creative studios, agent workflows, product directory, and creator growth."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prori", email = "hello@prori.ai" }]
keywords = ["prori", "prori.ai", "sdk", "product-discovery", "creator-growth", "ai-agent"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
urls = { Homepage = "https://prori.ai", Repository = "https://github.com/prori-ai/prori-python", Issues = "https://github.com/prori-ai/prori-python/issues" }
