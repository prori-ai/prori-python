[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prori"
version = "0.0.1"
description = "Official Prori SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Prori", email = "hello@prori.ai" }]
keywords = ["prori", "prori.ai", "distribution", "campaigns", "usdc", "sdk"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
urls = { Homepage = "https://prori.ai", Repository = "https://github.com/prori-ai/prori-python", Issues = "https://github.com/prori-ai/prori-python/issues" }
